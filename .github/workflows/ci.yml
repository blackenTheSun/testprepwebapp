name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, unit tests, build, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (engine, validator, fixtures)
        run: npm test
      - name: Build single-file index.html
        run: npm run build
      - name: Upload index.html
        uses: actions/upload-artifact@v4
        with:
          name: guided-test-prep-index-html
          path: dist/index.html
          if-no-files-found: error
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E acceptance tests (file://, offline) in Chromium, Firefox, WebKit
        run: npm run test:e2e:all
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
